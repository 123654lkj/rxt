[package]
name = "rxt"
version = "0.10.0"
edition = "2021"
description = "Run eXternal Tools — tiny core host that runs installable plugins"
repository = "https://github.com/123654lkj/rxt"

[[bin]]
name = "rxt"
path = "src/main.rs"

[[bin]]
name = "rxt-tools"
path = "src/bin/rxt-tools.rs"

[features]
default = ["remote", "xz", "http"]
# 远程 SSH/SFTP 能力。v0.4.2: 从 ssh2(→OpenSSL,Windows编译困难) 改用 russh(纯 Rust)。
# 彻底摆脱 OpenSSL/perl 依赖, 本地无 C 工具链也能编译 remote feature。
remote = ["russh", "tokio", "shellexpand"]
# .tar.xz/.txz 解压(xz2 → liblzma,需 gcc)。本地无 gcc 时关掉此 feature。
xz = ["xz2"]
# HTTP 客户端 + 星枢 mem（ureq）。Windows 默认可编。
http = ["ureq"]
# 读本机浏览器 Cookie（rookie/libesedb，Windows 常编不过）。
cookies = ["http", "rookie"]
# 旧编译命令兼容：http + cookies
net = ["http", "cookies"]

[dependencies]
clap = { version = "4", features = ["derive"] }
encoding_rs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
chrono = "0.4"
hex = "0.4"
toml = "0.8"
base64 = "0.22"
sha2 = "0.10"
md-5 = "0.10"
uuid = { version = "1", features = ["v4"] }
urlencoding = "2"
notify = "7"
dirs = "5"
shellexpand = { version = "3", optional = true }
ureq = { version = "3.3.0", features = ["json"], optional = true }
rookie = { version = "0.5.6", optional = true }
rayon = "1"
regex = "1"
libc = "0.2"
zip = { version = "2", default-features = false }
tar = "0.4"
flate2 = "1"
xz2 = { version = "0.1", optional = true }
sysinfo = "0.32"
# v0.4.2: russh 纯 Rust SSH 实现, 替代 ssh2。文件传输用 exec+base64 (避开 SFTP subsystem 兼容问题)
russh = { version = "0.61.2", default-features = false, features = ["rsa", "flate2", "ring"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync"], optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_LibraryLoader"] }